<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<!-- CONFIGURAÇÕES PWA ESSENCIAIS -->
<meta name="theme-color" content="#0a1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FFH4X">
<meta name="mobile-web-app-capable" content="yes">

<title>FFH4X - @guell714</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">

<style>
:root{
 --bg:#071226;
 --panel:#0a1b3a;
 --accent:#007aff;
 --accent-2:#0048b4;
 --muted:#b8d4ff;
 --glass:rgba(255,255,255,0.03);
}
*{
 box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
 user-select:none;
}
body{
 margin:0;
 background:radial-gradient(circle at 10% 10%,#00122e 0%,var(--bg) 40%),#000;
 height:100vh;
 color:var(--muted);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 overflow:hidden;
}
.card{
 width:100%;
 max-width:420px;
 background:linear-gradient(180deg,var(--panel),rgba(255,255,255,.01));
 border-radius:14px;
 padding:18px;
 border:1px solid rgba(0,122,255,.2);
 box-shadow:0 8px 30px rgba(0,0,0,.6);
 backdrop-filter:blur(6px);
 position:relative;
 z-index:2;
}
.title{display:flex;gap:12px;align-items:center}
.logo{
 width:48px;height:48px;border-radius:10px;
 background:linear-gradient(135deg,var(--accent),var(--accent-2));
 display:flex;align-items:center;justify-content:center;
 color:#fff;font-weight:700;
}
h1{margin:0;font-size:18px}
.small{font-size:13px;color:#b9d7ff}
input,button{
 width:100%;padding:12px;border-radius:10px;
 border:1px solid rgba(0,122,255,.15);
 background:var(--glass);color:var(--muted);font-size:16px;
}
button.primary{
 background:linear-gradient(90deg,var(--accent),var(--accent-2));
 border:none;margin-top:12px;font-weight:700;cursor:pointer;
}
.tabs{display:flex;gap:8px;margin-top:14px}
.tab{
 flex:1;text-align:center;padding:10px;border-radius:10px;cursor:pointer;
}
.tab.active{
 background:linear-gradient(90deg,rgba(0,122,255,.12),rgba(0,72,180,.08));
 color:#fff;
}
.option{
 display:flex;justify-content:space-between;align-items:center;
 padding:10px;margin-bottom:10px;border-radius:10px;
 background:rgba(255,255,255,.02);
}
.switch{
 width:40px;height:24px;border-radius:12px;
 background:rgba(255,255,255,.1);position:relative;
}
.switch .knob{
 width:18px;height:18px;border-radius:50%;
 background:#fff;position:absolute;top:3px;left:3px;transition:.2s;
}
.switch.on{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.switch.on .knob{left:19px}
.notify{display:none;text-align:center;margin-top:10px;color:var(--accent);font-weight:700}
.copyright{margin-top:12px;font-size:12px;text-align:center}

/* ✅ EFEITO SIMPLES DE ABA (FADE) */
.tab-content{
 display:none;
 opacity:0;
 transition:opacity .2s ease;
}
.tab-content.active{
 display:block;
 opacity:1;
}
</style>
</head>

<body>

<div class="card">
 <div class="title">
  <div class="logo">G</div>
  <div>
   <h1>FFH4X - @guell714</h1>
   <p class="small">Painel External | Versão Mobile</p>
  </div>
 </div>

<!-- LOGIN -->
<div id="loginSection">
 <p class="small">Preencha com sua Key:</p>
 <input id="senha" type="password" placeholder="Senha">
 <button class="primary" onclick="verificarSenha()">Entrar</button>
 <p class="small">@guell714</p>
</div>

<!-- PAINEL -->
<div id="painel" style="display:none;">
 <div class="tabs">
  <div id="tab1" class="tab active" onclick="setTab(1)"><i class="fas fa-crosshairs"></i></div>
  <div id="tab2" class="tab" onclick="setTab(2)"><i class="fas fa-cog"></i></div>
  <div id="tab3" class="tab" onclick="setTab(3)"><i class="fas fa-bullseye"></i></div>
 </div>

<div id="content1" class="tab-content active">
 <div class="option"><label>Aimbot Legit</label><div class="switch" onclick="toggle(this)"><div class="knob"></div></div></div>
 <div class="option"><label>Precisão Full</label><div class="switch" onclick="toggle(this)"><div class="knob"></div></div></div>
 <div class="option"><label>HS 100%</label><div class="switch" onclick="toggle(this)"><div class="knob"></div></div></div>
</div>

<div id="content2" class="tab-content">
 <div class="option"><label>NoRecoil</label><div class="switch" onclick="toggle(this)"><div class="knob"></div></div></div>
 <div class="option"><label>Aimlock 100%</label><div class="switch" onclick="toggle(this)"><div class="knob"></div></div></div>
</div>

<div id="content3" class="tab-content">
 <p class="small">Painel External</p>
 <p class="small">Criado por <strong>@guell714</strong></p>
</div>

<button class="primary" onclick="abrirFreeFire()">INJETAR FUNÇÕES NO JOGO</button>
<div id="notify" class="notify"></div>
<div class="copyright">© @guell714</div>
</div>

<script>
const VALID_KEYS=["M"];

function verificarSenha(){
 if(VALID_KEYS.includes(senha.value.trim().toUpperCase())){
  loginSection.style.display="none";
  painel.style.display="block";
 }else alert("Senha incorreta");
}

function setTab(i){
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));

 document.getElementById("tab"+i).classList.add("active");
 document.getElementById("content"+i).classList.add("active");
}

function toggle(el){el.classList.toggle("on")}

function abrirFreeFire(){
 notify.style.display="block";
 notify.innerText="Abrindo Free Fire...";
 setTimeout(()=>notify.style.display="none",2000);
}
</script>

</body>
</html>
